<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="./Weather Icons/svg_style.css" />
  </head>
  <body>
    <div class="card">
      <!-- nav bar -->
      <div class="wrapper">
        <div class="container-logo">
          <div class="logo-holder">
            <img src="images/logo.png" alt="app logo" />
          </div>
          <div class="app-name">Weather App</div>
        </div>
        <div class="container-search-group">
          <div class="search-group">
            <input type="text" id="city-name-input" />
            <button id="search-button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="bi bi-search search-icon"
                viewBox="0 0 16 16"
              >
                <path
                  d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
                />
              </svg>
            </button>
          </div>
          <div class="map-holder">
            <button id="map-button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="bi bi-geo-alt-fill"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- body  -->
      <div class="container-body">
        <!-- card for current time weather details -->
        <div class="current-card">
          <div class="current-time">3 May - 10:19 PM</div>
          <div class="weather-icon">
            <!-- Weather icon svg -->
            <img src="./images/weather-images/sun.png" />
          </div>
          <div class="temp-display">25 C / Cloudy</div>
          <div class="current-table">
            <div class="current-weather-cell flex-j-end">
              <img src="./images/weather-images/wind.png" />
              <div>35/ KMH</div>
            </div>
            <div class="current-weather-cell">
              <img src="./images/weather-images/wind.png" />
              <div>35/ KMH</div>
            </div>
            <div class="current-weather-cell flex-j-end">
              <img src="./images/weather-images/wind.png" />
              <div>35/ KMH</div>
            </div>
            <div class="current-weather-cell">
              <img src="./images/weather-images/wind.png" />
              <div>35/ KMH</div>
            </div>
            <div class="current-weather-cell flex-j-end">
              <img src="./images/weather-images/wind.png" />
              <div>35/ KMH</div>
            </div>
            <div class="current-weather-cell">
              <img src="./images/weather-images/wind.png" />
              <div>35/ KMH</div>
            </div>
          </div>
        </div>
        <!-- card for other days -->
        <div class="other-day-card"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
