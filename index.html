<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="card">
      <div class="wrapper">
        <div class="container-logo">
          <div class="logo-holder">H</div>
          <div class="app-name">Weather App</div>
        </div>

        <div class="container-search-group">
          <div class="search-group">
            <input type="text" id="city-name-input" />
            <button id="search-button">S</button>
          </div>
          <div class="map-holder">
            <button id="map-button">M</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
